[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "london-oa"
version = "0.1.0"
description = "Postcode-level planning-approval analysis for London Opportunity Areas"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "geopandas",
    "pyogrio",
    "shapely",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
